name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile check
        run: |
          python -m py_compile $(find helix -name '*.py' -type f ! -path '*__pycache__*')

      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest tests/ \
            --ignore=tests/test_subagent_simulation.py \
            --ignore=tests/test_skill_creation_script.py \
            --ignore=tests/test_local_model_service.py
